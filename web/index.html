<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notes - Powered by Musica</title>

    <!-- CSS Style Sheet boundary -->
    
    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background-color: #d8c9a3;
            color: #3b3528;
            position: relative
        }
        
        .settings-bar {
            text-align: center;
            padding: 12px;
        }
        
        .subtitle h2 {    
            margin: 0;
        }
        
        .notes-title {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .clef {
            font-size: 2.2em;
        }

        .note {
            font-size: 1.5em;
        }

        .script {
            font-family: cursive;
            font-size: 3em;
            font-style: italic;
        }

        .settings-button {
            padding: 6px 14px;
            font-size: 1em;
            border: 1px solid #777;
            border-radius: 4px;
            background-color: #ffffff;
            cursor: pointer;

            position: absolute;
            right: 20px;
            bottom: 15px;
        }

        .settings-button:hover {
            background-color: #e8e8e8;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color:
                rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #f4f4f4;
            margin: 10% auto;
            padding: 25px;
            border: 1px solid #777;
            border-radius: 6px;
            width: 420px;
            max-width: 85%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            font-size: 1.5em;
            cursor: pointer;
        }

        .setting-row {
            margin-bottom: 16px;
        }

        .setting-label {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .setting-value {
            padding-left: 10px;
            word-break: break-word;
        }

        .close-button {
            display: block;
            margin: 25px auto 0 auto;
            padding: 6px 20px;
            cursor: pointer;
        }
        
        .menu-bar_1 {
             text-align: center;
             padding: 4px 20px;
             margin: 0;
             background-color: #d8c9a3;
             border-top: 3px solid #777;
             border-bottom: 3px solid #777;
        }
        
        .menu-bar_2 {
             text-align: center;
             padding: 4px 20px;
             margin: 0;
             background-color: #d8c9a3;
             border-top: 0px solid #777;
             border-bottom: 3px solid #777;
        }
                
        .menu-button {
            padding: 8px 18px;
            margin: 0 8px;
            font-size: 1em;
            border: 1px solid #777;
            border-radius: 4px;
            cursor: pointer;
        }

        /* ============================================================
                          AUTHENTICATION DIALOG — CSS
           ============================================================ */
 
        #auth-dialog {
            display: none;
            align-items: center;
            justify-content: center;
        }

        .auth-dialog {
            # background-color: #f4f4f4;
            background-color: #d8c9a3;
            padding: 25px;
            border: 1px solid #777;
            border-radius: 6px;
            width: 420px;
            max-width: 85%;
        }

        .auth-title {
            text-align: center;
            font-size: 1.25em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .auth-content {
            width: 100%;
        }

        .auth-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .auth-row label {
            width: 110px;
            text-align: right;
            margin-right: 10px;
        }

        .auth-row input {
            flex: 1;
            padding: 6px;
         }

        .auth-attempt {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .auth-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
    
</head>

<body>
    <header>
        <div class="notes-title">
            <span class="clef">𝄞</span>
            <span class="note">♪</span>
            <span class="script">Musica-Notes</span>
            <span class="note">♫</span>
        </div>

        <div class="subtitle">
            <h2>Music Collection Database</h2>
        </div>

        <button class="settings-button" onclick="openSettings()">
            ⚙ Settings
        </button>

    </header>
    
    <div class="menu-bar_1">
        <button class="menu-button">Query</button>
        <button class="menu-button">Search</button>
    </div>
    
    <div
        id="editMenu"
        class="menu-bar_2">

        <button class="menu-button" onclick="modifyRecord()">
            Modify Record 
        </button>
    </div>
    
    <div
        id="editOptions"
        class="menu-bar_2"
        style="display: none;">

        <button class="menu-button">
            Add Record
        </button>

        <button class="menu-button">
            Modify Record
        </button>

        <button class="menu-button">
            Delete Record
        </button>

    </div>

    <div
        id="settingsModal"
        class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>
                    Musica-Notes Settings
                </h2>
                <span
                    class="close"
                    onclick="closeSettings()">
                    &times;
                </span>
            </div>

            <div
                id="settingsContent">
                Loading settings...
            </div>

            <button
                class="close-button"
                onclick="closeSettings()">
                Close
            </button>
        </div>
    </div>
    
   <!-- ============================================================
                     AUTHENTICATION DIALOG — HTML
        ============================================================ -->

    <div id="auth-dialog" class="modal-overlay">

    <div class="auth-dialog">

        <div class="auth-title">
            Data Access
        </div>

        <div class="auth-content">

            <div class="auth-row">
                <label for="master-user">
                    Master User:
                </label>

                <input
                    type="text"
                    id="master-user"
                    name="master-user"
                    autocomplete="off"
                >
            </div>

            <div class="auth-row">
                <label for="master-key">
                    Master Key:
                </label>

                <input
                    type="password"
                    id="master-key"
                    name="master-key"
                    autocomplete="off"
                >
            </div>

            <div id="auth-attempt" class="auth-attempt">
                Attempt 1 of 3
            </div>

        </div>

        <div class="auth-buttons">

            <button
                type="button"
                onclick="authenticateUser()">
                Access
            </button>

            <button
                type="button"
                onclick="closeAuthentication()">
                Cancel
            </button>

        </div>

    </div>

</div>
    <script>
        function openSettings() {

            const modal =
                document.getElementById(
                    "settingsModal"
                );

            const content =
                document.getElementById(
                    "settingsContent"
                );

            modal.style.display = "block";

            content.innerHTML =
                "Loading settings...";

            fetch(
                "./py/settings.py?format=json"
            )
            .then(
                response => {
                    console.log(
                        "response:",
                        response
                    );

                    return response.json();
                 }
             )
            .then(
                settings => {
                    usageType =
                        settings.USAGE_TYPE || "";
                        
                    displaySettings(
                        settings
                     );
                 }
             )
                        
            .catch(
                error => {
                    content.innerHTML =
                        "<b>Unable to load settings.</b>";

                    console.error(
                        error
                    );
                }
            );
        }

        function closeSettings() {
            const modal =
                document.getElementById(
                    "settingsModal"
                );
            modal.style.display = "none";
        }

        function displaySettings(settings) {
            const content =
                document.getElementById(
                    "settingsContent"
                );

            let html = "";

            html +=
                '<div class="setting-row">' +
                '<span class="setting-label">' +
                'Setup Type:' +
                '</span>' +
                '<div class="setting-value">' +

                settings.SETUP_TYPE +
                '</div>' +
                '</div>';

            html +=
                '<div class="setting-row">' +
                '<span class="setting-label">' +
                'Database:' +
                '</span>' +
                '<div class="setting-value">' +
                (
                    settings.DATABASE ||
                    "Not configured"
                ) +
                '</div>' +
                '</div>';

            if (settings.MASTER_IP) {
                html +=
                    '<div class="setting-row">' +
                    '<span class="setting-label">' +
                    'Master IP:' +
                    '</span>' +
                    '<div class="setting-value">' +

                    settings.MASTER_IP +
                    '</div>' +
                    '</div>';
            }

            if (
                settings.MASTER_USER &&
                settings.MASTER_USER.length > 0
            ) {
                html +=
                    '<div class="setting-row">' +
                    '<span class="setting-label">' +
                    'Master Users:' +
                    '</span>' +
                    '<div class="setting-value">' +

                    settings.MASTER_USER.join(
                        "<br>"
                    ) +
                    '</div>' +
                    '</div>';
            }
            
            if (settings.USAGE_TYPE) {
                html +=
                    '<div class="setting-row">' +
                    '<span class="setting-label">' +
                    'Usage Type:' +
                    '</span>' +
                    '<div class="setting-value">' +

                    settings.USAGE_TYPE +
                    '</div>' +
                    '</div>';
            }

            if (settings.ERROR) {
                html +=
                    '<div class="setting-row">' +
                    '<span class="setting-label">' +
                    'Error:' +
                    '</span>' +
                    '<div class="setting-value">' +

                    settings.ERROR +
                    '</div>' +
                    '</div>';
            }

            content.innerHTML = html;
        }
        
        /* ============================================================
                   AUTHENTICATION DIALOG — JAVASCRIPT
           ============================================================ */
        let usageType = "";
        
        let accessState = "JAU";

        let authAttempts = 1;
        
        function modifyRecord() {

            if (usageType === "Personal") {
                enterPU();
                return;
            }

            if (usageType === "Commercial") {
                openAuthentication();
                return;
            }

            alert("Unable to determine Usage Type.");
        }
  
        function enterPU() {

            accessState = "PU";

            document.getElementById("editMenu").style.display = "none";
            document.getElementById("editOptions").style.display = "block";
        }


        function leavePU() {

            accessState = "JAU";

            document.getElementById("editOptions").style.display = "none";
            document.getElementById("editMenu").style.display = "block";
        }
              
        
        function loadUsageType() {

            fetch("./py/settings.py?format=json")
                .then(
                    response => response.json()
                 )
                .then(
                    settings => {
                        usageType = settings.USAGE_TYPE || "";
                    }
                 )
                 .catch(
                    error => {
                        console.error(
                            "Unable to load Usage Type:",
                            error
                        );
                    }
                );
        }

        function openAuthentication() {

           authAttempts = 1;

           document.getElementById("master-user").value = "";
           document.getElementById("master-key").value = "";

           document.getElementById("auth-attempt").textContent =
               "Attempt 1 of 3";

           document.getElementById("auth-dialog").style.display = "flex";

           document.getElementById("master-user").focus();
        }

        function closeAuthentication() {

            document.getElementById("auth-dialog").style.display = "none";

            document.getElementById("master-user").value = "";
            document.getElementById("master-key").value = "";
        }

        //function authenticateUser() {
        //
        //    const masterUser =
        //    document.getElementById("master-user").value.trim();
        //
        //    const masterKey =
        //    document.getElementById("master-key").value;
        //
        //    if (masterUser === "" || masterKey === "") {
        //
        //        alert("Master User and Master Key are required.");
        //
        //        return;
        //    }
        //    alert("Authentication backend not yet implemented.");
        //}
        
        function authenticateUser() {

        const masterUser =
            document.getElementById("master-user").value.trim();

        const masterKey =
            document.getElementById("master-key").value;

        if (masterUser === "" || masterKey === "") {

            alert("Master User and Master Key are required.");

            return;
        }

        const data =
            new URLSearchParams();

        data.append(
            "master_user",
             masterUser
        );

        data.append(
            "master_key",
            masterKey
        );

        fetch(
            "./py/authenticate.py",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body: data
            }
        )
        .then(
            response => response.json()
        )
        .then(
            result => {

                if (result.authenticated) {

                    enterPU();
                    closeAuthentication();

                    return;
                }

                authAttempts++;

                if (authAttempts > 3) {

                    alert(
                        "Authentication failed. Access denied."
                    );

                    closeAuthentication();
                    return;
                }

                document.getElementById(
                    "auth-attempt"
                ).textContent =
                    "Attempt " +
                    authAttempts +
                " of 3";

                document.getElementById(
                    "master-key"
                ).value = "";

                document.getElementById(
                   "master-key"
                ).focus();
            }
        )
        .catch(
            error => {

                console.error(
                    "Authentication error:",
                    error
                    );

                alert(
                    "Unable to contact authentication service."
                    );
                }
             );
        }
        
        window.onclick =
            function(event) {
                const modal =
                    document.getElementById(
                        "settingsModal"
                    );

                if (
                    event.target == modal
                ) {
                    closeSettings();
                }
            };

        loadUsageType();
        
    </script>
</body>
</html>

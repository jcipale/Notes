<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notes - Powered by Musica</title>

    <!-- CSS Style Sheet boundary -->
    
    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background-color: #d8c9a3;
            color: #3b3528;
            position: relative
        }
        
        .settings-bar {
            text-align: center;
            padding: 12px;
        }
        
        .subtitle h2 {    
            margin: 0;
        }
        
        .notes-title {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .clef {
            font-size: 2.2em;
        }

        .note {
            font-size: 1.5em;
        }

        .script {
            font-family: cursive;
            font-size: 3em;
            font-style: italic;
        }

        .settings-button {
            padding: 6px 14px;
            font-size: 1em;
            border: 1px solid #777;
            border-radius: 4px;
            background-color: #ffffff;
            cursor: pointer;

            position: absolute;
            right: 20px;
            bottom: 15px;
        }

        .settings-button:hover {
            background-color: #e8e8e8;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color:
                rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #f4f4f4;
            margin: 10% auto;
            padding: 25px;
            border: 1px solid #777;
            border-radius: 6px;
            width: 420px;
            max-width: 85%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            font-size: 1.5em;
            cursor: pointer;
        }

        .setting-row {
            margin-bottom: 16px;
        }

        .setting-label {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .setting-value {
            padding-left: 10px;
            word-break: break-word;
        }

        .close-button {
            display: block;
            margin: 25px auto 0 auto;
            padding: 6px 20px;
            cursor: pointer;
        }
        
        .menu-bar_top {
             text-align: center;
             padding: 4px 20px;
             margin: 0;
             background-color: #d8c9a3;
             border-top: 3px solid #777;
             border-bottom: 3px solid #777;
        }
        
        .menu-bar_query {
             text-align: center;
             padding: 4px 20px;
             margin: 0;
             background-color: #d8c9a3;
             border-top: 0px solid #777;
             border-bottom: 3px solid #777;
        }
                
        .menu-button {
            padding: 8px 18px;
            margin: 0 8px;
            font-size: 1em;
            border: 1px solid #777;
            border-radius: 4px;
            cursor: pointer;
        }

        /* ============================================================
                          AUTHENTICATION DIALOG — CSS
           ============================================================ */
 
        #auth-dialog {
            display: none;
            align-items: center;
            justify-content: center;
        }

        .auth-dialog {
            # background-color: #f4f4f4;
            background-color: #d8c9a3;
            padding: 25px;
            border: 1px solid #777;
            border-radius: 6px;
            width: 420px;
            max-width: 85%;
        }

        .auth-title {
            text-align: center;
            font-size: 1.25em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .auth-content {
            width: 100%;
        }

        .auth-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .auth-row label {
            width: 110px;
            text-align: right;
            margin-right: 10px;
        }

        .auth-row input {
            flex: 1;
            padding: 6px;
         }

        .auth-attempt {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .auth-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        /* ============================================================
                           QUERY DIALOG — CSS
           ============================================================ */

        #queryPanel {
            display: none;
            padding: 18px 24px 22px 24px;
            background-color: #f4f4f4;
            border-bottom: 3px solid #777;
        }

        .query-panel {
            max-width: 900px;
            margin: 0 auto;
        }

        .query-title {
            margin: 0 0 18px 0;
            text-align: center;
            font-size: 1.35em;
            font-weight: bold;
        }

        .query-section {
            margin-bottom: 18px;
            padding: 14px 18px;
            border: 1px solid #aaa;
            border-radius: 5px;
            background-color: #ffffff;
        }

        .query-section-title {
            margin: 0 0 12px 0;
            font-weight: bold;
        }

        .query-row {
            display: grid;
            grid-template-columns: 72px 1fr;
            align-items: center;
            width: 100%;
            margin: 0 0 10px 0;
        }

        .query-row label {
            width: auto;
            text-align: left;
            margin-right: 10px;
            font-weight: bold;
        }

        .query-row input[type="text"] {
            width: 100%;
            padding: 7px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .query-row-format {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .query-row-format > label {
            width: 72px;
            margin-right: 10px;
            font-weight: bold;
        }

        .query-row-format select {
            width: 130px;
            padding: 7px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .query-checks {
            display: flex;
            gap: 18px;
            align-items: center;
            margin: 0 0 0 18px;
        }

        .query-checks-vertical {
            flex-direction: row;
            align-items: center;
            gap: 18px;
            margin-left: 18px;
        }

        .query-check {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .query-display-grid {
            display: grid;
            grid-template-columns: auto auto;
            justify-content: start;
            gap: 10px 40px;
            width: fit-content;
            margin: 0;
        }

        .query-section.display-fields {
            width: 430px;
            margin-left: auto;
            margin-right: auto;
        }

        .query-section.display-fields .query-display-grid {
            margin-left: 0;
        }

        @media (max-width: 650px) {
            .query-section.display-fields {
                width: auto;
            }

            .query-row {
                grid-template-columns: 72px 1fr;
            }

            .query-row-format > label {
                width: 72px;
            }

            .query-checks {
                gap: 10px;
                margin-left: 12px;
            }
        }

        .query-actions {
            text-align: center;
            margin-top: 6px;
        }

        .query-actions button {
            padding: 7px 18px;
            margin: 0 5px;
            font-size: 1em;
            border: 1px solid #777;
            border-radius: 4px;
            cursor: pointer;
        }

        .query-results {
            margin-top: 18px;
            overflow-x: auto;
        }

        .query-results-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .query-results table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
        }

        .query-results th,
        .query-results td {
            border: 1px solid #999;
            padding: 6px 8px;
            text-align: left;
            white-space: nowrap;
        }

    </style>
    
</head>

<body>
    <header>
        <div class="notes-title">
            <span class="clef">𝄞</span>
            <span class="note">♪</span>
            <span class="script">Musica-Notes</span>
            <span class="note">♫</span>
        </div>

        <div class="subtitle">
            <h2>Music Collection Database</h2>
        </div>

        <button class="settings-button" onclick="openSettings()">
            ⚙ Settings
        </button>

    </header>
    
    <div class="menu-bar_top">
        <button class="menu-button" onclick="openQuery()">Query</button>
    </div>
    
    <div
        id="editMenu"
        class="menu-bar_query">

        <button class="menu-button" onclick="modifyRecord()">
            Modify Record 
        </button>
    </div>
    
    <div
        id="editOptions"
        class="menu-bar_query"
        style="display: none;">

        <button class="menu-button">
            Add Record
        </button>

        <button class="menu-button">
            Modify Record
        </button>

        <button class="menu-button">
            Delete Record
        </button>

    </div>


    <!-- ============================================================
                           QUERY DIALOG — HTML
         ============================================================ -->

    <div id="queryPanel">
        <div class="query-panel">

            <div class="query-title">Query</div>

            <div class="query-section">
                <div class="query-section-title">Primary Search Keys</div>

                <div class="query-row">
                    <label for="query-artist">Artist:</label>
                    <input type="text" id="query-artist" name="query-artist"
                           autocomplete="off">
                </div>

                <div class="query-row">
                    <label for="query-title">Title:</label>
                    <input type="text" id="query-title" name="query-title"
                           autocomplete="off">
                </div>
            </div>

            <div class="query-section">
                <div class="query-section-title">Secondary Search Parameters</div>

                <div class="query-row">
                    <label for="query-genre">Genre:</label>
                    <input type="text" id="query-genre" name="query-genre"
                           autocomplete="off">
                </div>
                <div class="query-row-format">
                    <label for="query-format">Format:</label>
                    <select id="query-format" name="query-format">
                        <option value="">Any</option>
                        <option value="LP">LP</option>
                        <option value="CD">CD</option>
                        <option value="Cass">Cassette</option>
                        <option value="RTR">RTR</option>
                        <option value="78">78 RPM</option>
                        <option value="4T">4-track</option>
                        <option value="8T">8-track</option>
                    </select>

                    <div class="query-checks">
                        <label class="query-check">
                            <input type="checkbox" id="query-reissue" name="query-reissue">
                            Reissue
                        </label>

                        <label class="query-check">
                            <input type="checkbox" id="query-dbx" name="query-dbx">
                            DBX
                        </label>
                    </div>
                </div>
            </div>

            <div class="query-section display-fields">
                <div class="query-section-title">Optional Display Fields</div>

                <div class="query-display-grid">
                    <label class="query-check">
                        <input type="checkbox" id="display-genre" name="display-genre">
                        Genre
                    </label>

                    <label class="query-check">
                        <input type="checkbox" id="display-year" name="display-year">
                        Year
                    </label>

                    <label class="query-check">
                        <input type="checkbox" id="display-reissue" name="display-reissue">
                        Reissue
                    </label>

                    <label class="query-check">
                        <input type="checkbox" id="display-dbx" name="display-dbx">
                        DBX
                    </label>

                    <label class="query-check">
                        <input type="checkbox" id="display-label" name="display-label">
                        Label
                    </label>

                    <label class="query-check">
                        <input type="checkbox" id="display-catalog-id" name="display-catalog-id">
                        Catalog ID
                    </label>
                </div>
            </div>

            <div class="query-actions">
                <button type="button" onclick="executeQuery()">Search</button>
                <button type="button" onclick="clearQuery()">Clear</button>
                <button type="button" onclick="closeQuery()">Close</button>
            </div>

            <div id="queryResults" class="query-results" style="display: none;">
                <div class="query-results-title">Results</div>
                <table>
                    <thead>
                        <tr>
                            <th>Rec ID</th>
                            <th>Artist</th>
                            <th>Title</th>
                            <th>Genre</th>
                            <th>Year</th>
                            <th>Label</th>
                            <th>Catalog ID</th>
                            <th>Reissue</th>
                            <th>DBX</th>
                        </tr>
                    </thead>
                    <tbody id="queryResultsBody"></tbody>
                </table>
            </div>

        </div>
    </div>

    <div
        id="settingsModal"
        class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>
                    Musica-Notes Settings
                </h2>
                <span
                    class="close"
                    onclick="closeSettings()">
                    &times;
                </span>
            </div>

            <div
                id="settingsContent">
                Loading settings...
            </div>

            <button
                class="close-button"
                onclick="closeSettings()">
                Close
            </button>
        </div>
    </div>
    
   <!-- ============================================================
                     AUTHENTICATION DIALOG — HTML
        ============================================================ -->

    <div id="auth-dialog" class="modal-overlay">

    <div class="auth-dialog">

        <div class="auth-title">
            Data Access
        </div>

        <div class="auth-content">

            <div class="auth-row">
                <label for="master-user">
                    Master User:
                </label>

                <input
                    type="text"
                    id="master-user"
                    name="master-user"
                    autocomplete="off"
                >
            </div>

            <div class="auth-row">
                <label for="master-key">
                    Master Key:
                </label>

                <input
                    type="password"
                    id="master-key"
                    name="master-key"
                    autocomplete="off"
                >
            </div>

            <div id="auth-attempt" class="auth-attempt">
                Attempt 1 of 3
            </div>

        </div>

        <div class="auth-buttons">

            <button
                type="button"
                onclick="authenticateUser()">
                Access
            </button>

            <button
                type="button"
                onclick="closeAuthentication()">
                Cancel
            </button>

        </div>

    </div>

</div>
    <script>
        function openSettings() {

            const modal =
                document.getElementById(
                    "settingsModal"
                );

            const content =
                document.getElementById(
                    "settingsContent"
                );

            modal.style.display = "block";

            content.innerHTML =
                "Loading settings...";

            fetch(
                "./py/settings.py?format=json"
            )
            .then(
                response => {
                    console.log(
                        "response:",
                        response
                    );

                    return response.json();
                 }
             )
            .then(
                settings => {
                    usageType =
                        settings.USAGE_TYPE || "";
                        
                    displaySettings(
                        settings
                     );
                 }
             )
                        
            .catch(
                error => {
                    content.innerHTML =
                        "<b>Unable to load settings.</b>";

                    console.error(
                        error
                    );
                }
            );
        }

        function closeSettings() {
            const modal =
                document.getElementById(
                    "settingsModal"
                );
            modal.style.display = "none";
        }

        function displaySettings(settings) {
            const content =
                document.getElementById(
                    "settingsContent"
                );

            let html = "";

            html +=
                '<div class="setting-row">' +
                '<span class="setting-label">' +
                'Setup Type:' +
                '</span>' +
                '<div class="setting-value">' +

                settings.SETUP_TYPE +
                '</div>' +
                '</div>';

            html +=
                '<div class="setting-row">' +
                '<span class="setting-label">' +
                'Database:' +
                '</span>' +
                '<div class="setting-value">' +
                (
                    settings.DATABASE ||
                    "Not configured"
                ) +
                '</div>' +
                '</div>';

            if (settings.MASTER_IP) {
                html +=
                    '<div class="setting-row">' +
                    '<span class="setting-label">' +
                    'Master IP:' +
                    '</span>' +
                    '<div class="setting-value">' +

                    settings.MASTER_IP +
                    '</div>' +
                    '</div>';
            }

            if (
                settings.MASTER_USER &&
                settings.MASTER_USER.length > 0
            ) {
                html +=
                    '<div class="setting-row">' +
                    '<span class="setting-label">' +
                    'Master Users:' +
                    '</span>' +
                    '<div class="setting-value">' +

                    settings.MASTER_USER.join(
                        "<br>"
                    ) +
                    '</div>' +
                    '</div>';
            }
            
            if (settings.USAGE_TYPE) {
                html +=
                    '<div class="setting-row">' +
                    '<span class="setting-label">' +
                    'Usage Type:' +
                    '</span>' +
                    '<div class="setting-value">' +

                    settings.USAGE_TYPE +
                    '</div>' +
                    '</div>';
            }

            if (settings.ERROR) {
                html +=
                    '<div class="setting-row">' +
                    '<span class="setting-label">' +
                    'Error:' +
                    '</span>' +
                    '<div class="setting-value">' +

                    settings.ERROR +
                    '</div>' +
                    '</div>';
            }

            content.innerHTML = html;
        }
        

        /* ============================================================
                           QUERY DIALOG — JAVASCRIPT
           ============================================================ */

        function openQuery() {
            document.getElementById("queryPanel").style.display = "block";
            document.getElementById("query-artist").focus();
        }

        function closeQuery() {
            document.getElementById("queryPanel").style.display = "none";
        }

        function clearQuery() {
            document.getElementById("query-artist").value = "";
            document.getElementById("query-title").value = "";
            document.getElementById("query-genre").value = "";
            document.getElementById("query-format").value = "";
            document.getElementById("query-reissue").checked = false;
            document.getElementById("query-dbx").checked = false;

            document.getElementById("display-genre").checked = false;
            document.getElementById("display-year").checked = false;
            document.getElementById("display-reissue").checked = false;
            document.getElementById("display-dbx").checked = false;
            document.getElementById("display-label").checked = false;
            document.getElementById("display-catalog-id").checked = false;
            document.getElementById("queryResultsBody").innerHTML = "";
            document.getElementById("queryResults").style.display = "none";
        }

        function executeQuery() {
            /*
             * UI only for now.
             * The API/SQL plumbing will be connected after the
             * Query request/response contract is finalized.
             */
            alert("Query UI is ready. Database query service not yet connected.");
        }

        /* ============================================================
                   AUTHENTICATION DIALOG — JAVASCRIPT
           ============================================================ */
        let usageType = "";
        
        let accessState = "JAU";

        let authAttempts = 1;
        
        function modifyRecord() {

            if (usageType === "Personal") {
                enterPU();
                return;
            }

            if (usageType === "Commercial") {
                openAuthentication();
                return;
            }

            alert("Unable to determine Usage Type.");
        }
  
        function enterPU() {

            accessState = "PU";

            document.getElementById("editMenu").style.display = "none";
            document.getElementById("editOptions").style.display = "block";
        }


        function leavePU() {

            accessState = "JAU";

            document.getElementById("editOptions").style.display = "none";
            document.getElementById("editMenu").style.display = "block";
        }
              
        
        function loadUsageType() {

            fetch("./py/settings.py?format=json")
                .then(
                    response => response.json()
                 )
                .then(
                    settings => {
                        usageType = settings.USAGE_TYPE || "";
                    }
                 )
                 .catch(
                    error => {
                        console.error(
                            "Unable to load Usage Type:",
                            error
                        );
                    }
                );
        }

        function openAuthentication() {

           authAttempts = 1;

           document.getElementById("master-user").value = "";
           document.getElementById("master-key").value = "";

           document.getElementById("auth-attempt").textContent =
               "Attempt 1 of 3";

           document.getElementById("auth-dialog").style.display = "flex";

           document.getElementById("master-user").focus();
        }

        function closeAuthentication() {

            document.getElementById("auth-dialog").style.display = "none";

            document.getElementById("master-user").value = "";
            document.getElementById("master-key").value = "";
        }

        //function authenticateUser() {
        //
        //    const masterUser =
        //    document.getElementById("master-user").value.trim();
        //
        //    const masterKey =
        //    document.getElementById("master-key").value;
        //
        //    if (masterUser === "" || masterKey === "") {
        //
        //        alert("Master User and Master Key are required.");
        //
        //        return;
        //    }
        //    alert("Authentication backend not yet implemented.");
        //}
        
        function authenticateUser() {

        const masterUser =
            document.getElementById("master-user").value.trim();

        const masterKey =
            document.getElementById("master-key").value;

        if (masterUser === "" || masterKey === "") {

            alert("Master User and Master Key are required.");

            return;
        }

        const data =
            new URLSearchParams();

        data.append(
            "master_user",
             masterUser
        );

        data.append(
            "master_key",
            masterKey
        );

        fetch(
            "./py/authenticate.py",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body: data
            }
        )
        .then(
            response => response.json()
        )
        .then(
            result => {

                if (result.authenticated) {

                    enterPU();
                    closeAuthentication();

                    return;
                }

                authAttempts++;

                if (authAttempts > 3) {

                    alert(
                        "Authentication failed. Access denied."
                    );

                    closeAuthentication();
                    return;
                }

                document.getElementById(
                    "auth-attempt"
                ).textContent =
                    "Attempt " +
                    authAttempts +
                " of 3";

                document.getElementById(
                    "master-key"
                ).value = "";

                document.getElementById(
                   "master-key"
                ).focus();
            }
        )
        .catch(
            error => {

                console.error(
                    "Authentication error:",
                    error
                    );

                alert(
                    "Unable to contact authentication service."
                    );
                }
             );
        }
        
        window.onclick =
            function(event) {
                const modal =
                    document.getElementById(
                        "settingsModal"
                    );

                if (
                    event.target == modal
                ) {
                    closeSettings();
                }
            };

        loadUsageType();
        
    </script>
</body>
</html>

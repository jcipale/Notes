<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notes - Powered by Musica</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
        }

		<!--
        header {
            text-align: center;
            padding: 30px 20px;
            background-color: #333;
            color: white;
        }
		-->

        header {
            text-align: center;
            padding: 30px 20px;
            background-color: #d8c9a3;
            color: #3b3528;
        }

        .notes-title {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .clef {
            font-size: 2.2em;
        }
        
        .note {
            font-size: 1.5em;
        }

        .script {
            font-family: cursive;
            font-size: 3em;
            font-style: italic;
        }

		header h1 {
            margin: 0;
            font-family: cursive;
            font-size: 4em;
        }

        header p {
            margin: 8px 0 0 0;
            font-size: 1em;
            font-style: italic;
        }

    </style>

</head>

<body>

    <header>

    <div class="notes-title">
        <span class="clef">𝄞</span>
        <span class="note">♪</span>
        <span class="script">Notes</span>
        <span class="note">♫</span>
    </div>	

    </header>

</body>
</html>
